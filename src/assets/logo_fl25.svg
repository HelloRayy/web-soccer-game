<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17FFBF" />
      <stop offset="100%" stop-color="#00D8F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="600" height="200" fill="#030608" rx="24"/>
  <text x="60" y="140" font-family="sans-serif" font-size="110" font-weight="900" font-style="italic" fill="url(#metalGrad)" letter-spacing="-4">FL</text>
  <text x="260" y="140" font-family="sans-serif" font-size="110" font-weight="900" font-style="italic" fill="url(#neonGrad)" filter="url(#glow)" letter-spacing="-4">25</text>
</svg>